<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="chartGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="50%" stop-color="#fb7185" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="64" height="64" rx="16" fill="url(#bg)" />
  <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="#334155" stroke-width="1.5" />

  <!-- Outer Pulse Ring -->
  <circle cx="32" cy="32" r="26" stroke="#f43f5e" stroke-width="1" stroke-dasharray="4 3" opacity="0.4" />

  <!-- Shield Shape (Market Protection) -->
  <path d="M32 10 L48 16 V28 C48 39.5 41.2 48.5 32 52 C22.8 48.5 16 39.5 16 28 V16 L32 10 Z" 
        fill="#0f172a" stroke="url(#shieldGrad)" stroke-width="2.5" stroke-linejoin="round" />

  <!-- Candlestick / Stock Chart Line -->
  <!-- Down surge & Halt Indicator -->
  <path d="M22 26 L27 33 L32 23 L37 38 L42 30" 
        stroke="url(#chartGrad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />

  <!-- Circuit Breaker / Sidecar Pause Flash Bar -->
  <line x1="28" y1="38" x2="36" y2="38" stroke="#f43f5e" stroke-width="3" stroke-linecap="round" />
  
  <!-- Alert Dot -->
  <circle cx="44" cy="18" r="3.5" fill="#f43f5e" />
  <circle cx="44" cy="18" r="6" fill="none" stroke="#f43f5e" stroke-width="1" opacity="0.6" />
</svg>
